<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزاد النجوم والأيقونات</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --gold: #f59e0b; --green: #10b981; --blue: #3b82f6; --purple: #8b5cf6; --red: #ef4444; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid #30363d; }
        .dev-badge { background: rgba(245,158,11,0.15); border: 1px solid var(--gold); color: #fef08a; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        input, button { width: 100%; padding: 10px; margin: 4px 0; border-radius: 8px; border: 1px solid #30363d; background: #21262d; color: #fff; box-sizing: border-box; }
        button { background: var(--blue); font-weight: bold; cursor: pointer; border: none; }
        button:active { transform: scale(0.98); }
        
        .members-box { background: #0f172a; border: 1px solid var(--blue); border-radius: 10px; padding: 8px; margin-bottom: 10px; font-size: 13px; text-align: right; }
        .user-tag { background: #0369a1; border: 1px solid #38bdf8; color: white; padding: 2px 6px; border-radius: 4px; margin: 2px; display: inline-block; font-size: 11px; }

        .fut-card { background: linear-gradient(135deg, #1e1b4b, #4c1d95); border: 2px solid var(--gold); border-radius: 14px; padding: 12px; position: relative; margin: 8px 0; }
        .player-avatar { width: 110px; height: 110px; margin: 10px auto; border-radius: 50%; background: #2e1065; border: 3px solid var(--gold); display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .rating { font-size: 32px; font-weight: 900; color: #fef08a; }
        .pos { background: var(--gold); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .name { font-size: 22px; font-weight: bold; margin: 8px 0; color: #ffffff; }
        .timer-badge { background: var(--red); padding: 4px 12px; border-radius: 10px; font-weight: bold; display: inline-block; margin-bottom: 6px; }
        .bid-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
        .btn-bid { background: var(--green); padding: 10px 0; font-weight: bold; }
        .btn-finish { background: linear-gradient(135deg, #b91c1c, #ef4444); color: white; font-size: 15px; margin-top: 6px; padding: 12px; border-radius: 10px; }
        .pitch-box { background: #14532d; border: 1px solid #22c55e; border-radius: 10px; padding: 8px; margin-top: 8px; font-size: 12px; }
        .player-tag { background: #1e293b; border: 1px solid var(--gold); padding: 4px 8px; border-radius: 6px; margin: 2px; display: inline-block; }
        .hidden { display: none !important; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <div class="dev-badge">👑 تطوير: محمد خميس</div>

        <!-- شاشة الدخول -->
        <div id="setup-screen" class="card">
            <h3>⚽ دخول المزاد</h3>
            <input type="text" id="username" placeholder="اسم المدرب (مثال: محمد)">
            <input type="text" id="room-code" placeholder="كود الغرفة (أحرف أو أرقام فقط)">
            <button onclick="joinGame(false)">دخول كـ مدرب</button>
            <button onclick="joinGame(true)" style="background: var(--purple);">دخول كـ آدمن</button>
        </div>

        <!-- شاشة اللعبة -->
        <div id="game-screen" class="card hidden">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:8px;">
                <span id="room-txt">غرفة: --</span>
                <span style="color:var(--green);">💰 <span id="budget">200</span>M$</span>
            </div>

            <!-- قائمة الحضور -->
            <div class="members-box">
                <b>👥 المتواجدون بالروم الآن:</b>
                <div id="room-users" style="margin-top:4px;"><span style="color:#9ca3af;">جاري الاتصال...</span></div>
            </div>

            <!-- لوحة التحكم للآدمن -->
            <div id="admin-panel" class="card hidden" style="background:#1f2937;">
                <input type="number" id="custom-timer" value="20" placeholder="الوقت بالثواني">
                <button onclick="startNextAuction()" style="background:var(--gold); color:#000;"> سحب لاعب جديد</button>
            </div>

            <!-- كارت المزاد -->
            <div id="auction-area" class="card hidden">
                <div class="timer-badge">⏱️ المتبقي: <span id="timer">20</span>s</div>
                <div class="fut-card">
                    <span id="player-pos" class="pos">--</span>
                    <div class="rating" id="player-rating">--</div>
                    <div class="player-avatar">
                        <img id="player-img" src="" alt="لاعب" onerror="this.src='https://via.placeholder.com/110';">
                    </div>
                    <div id="player-name" class="name">--</div>
                </div>

                <div style="font-size:16px; margin:8px 0;">
                    أعلى مزايدة: <b id="highest-bid" style="color:var(--gold);">0</b>M$ 
                    <br><small>(بواسطة: <span id="highest-bidder" style="color:var(--blue);">لا أحد</span>)</small>
                </div>

                <div class="bid-grid">
                    <button class="btn-bid" onclick="placeBid(1)">+1M</button>
                    <button class="btn-bid" onclick="placeBid(5)">+5M</button>
                    <button class="btn-bid" onclick="placeBid(10)">+10M</button>
                    <button class="btn-bid" onclick="placeBid(20)">+20M</button>
                </div>
            </div>

            <!-- التشكيلة -->
            <div class="pitch-box">
                <b>تشكيلتي الخاصة (<span id="team-count">0</span>):</b>
                <div id="my-team" style="margin-top:4px;">لا يوجد لاعبين بعد</div>
            </div>

            <button class="btn-finish" onclick="finishMyAuction()">إنهاء المزاد وعرض التشكيلة 🏆</button>
        </div>
    </div>    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            databaseURL: "https://realtime-fae37-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // مصفوفة اللاعبين بمسار المجلد الجديد Image/
        const realAndIconPlayers = [
            { name: "إمام عاشور", pos: "CM", rating: 78, photo: "Image/Ashour.webp" },
            { name: "جانلويجي بوفون", pos: "GK", rating: 91, photo: "Image/Buffon.webp" },
            { name: "يوهان كرويف", pos: "CF", rating: 95, photo: "Image/Cruyff.webp" },
            { name: "عثمان ديمبيلي", pos: "RW", rating: 86, photo: "Image/Demble.webp" },
            { name: "ديزيري دويه", pos: "CAM", rating: 78, photo: "Image/Doue.webp" },
            { name: "جيانلويجي دوناروما", pos: "GK", rating: 87, photo: "Image/Dounurema.webp" },
            { name: "باولو ديبالا", pos: "CAM", rating: 86, photo: "Image/Dybala.webp" },
            { name: "إرلينج هالاند", pos: "ST", rating: 91, photo: "Image/Haland.webp" },
            { name: "تيري هنري", pos: "ST", rating: 93, photo: "Image/Henry.webp" },
            { name: "لامين يامال", pos: "RW", rating: 81, photo: "Image/Lamine Yamal.webp" },
            { name: "رياض محرز", pos: "RW", rating: 85, photo: "Image/Mahrez.webp" },
            { name: "باولو مالديني", pos: "CB", rating: 94, photo: "Image/Maldini.webp" },
            { name: "كيليان إمبابي", pos: "ST", rating: 91, photo: "Image/Mappe.webp" },
            { name: "عمر مرموش", pos: "ST", rating: 83, photo: "Image/Marmoush.webp" },
            { name: "دييجو مارادونا", pos: "CAM", rating: 97, photo: "Image/Marodona.webp" },
            { name: "ليونيل ميسي", pos: "RW", rating: 92, photo: "Image/Messi.webp" },
            { name: "لوكا مودريتش", pos: "CM", rating: 87, photo: "Image/Modric.webp" },
            { name: "نيمار جونيور", pos: "LW", rating: 89, photo: "Image/Neymar.Jr .webp" },
            { name: "نيمار", pos: "LW", rating: 89, photo: "Image/Neymar.webp" },
            { name: "ديكلان رايس", pos: "CDM", rating: 87, photo: "Image/Rice.webp" },
            { name: "كريستيانو رونالدو", pos: "ST", rating: 91, photo: "Image/Ronaldo.jpeg" },
            { name: "محمد صلاح", pos: "RW", rating: 89, photo: "Image/Salah.webp" },
            { name: "سيرجيو راموس", pos: "CB", rating: 91, photo: "Image/SergioRamos.jpg" },
            { name: "فان دايك", pos: "CB", rating: 89, photo: "Image/Vandijk.webp" },
            { name: "فينيسيوس جونيور", pos: "LW", rating: 89, photo: "Image/vini.webp" },
            { name: "زين الدين زيدان", pos: "CAM", rating: 96, photo: "Image/zidane.webp" }
        ];

        let currentUser = "";
        let currentRoom = "";
        let isAdmin = false;
        let myBudget = 200;
        let myTeam = [];
        let timerInterval = null;
        let currentAuctionData = null;

        function joinGame(adminStatus) {
            const userIn = document.getElementById('username').value.trim();
            const roomIn = document.getElementById('room-code').value.trim();

            if (!userIn || !roomIn) {
                alert("يرجى كتابة الاسم وكود الغرفة!");
                return;
            }

            currentUser = userIn;
            currentRoom = roomIn;
            isAdmin = adminStatus;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('room-txt').innerText = "غرفة: " + currentRoom;

            if (isAdmin) {
                document.getElementById('admin-panel').classList.remove('hidden');
            }

            // تسجيل التواجد بالروم
            const userRef = db.ref(`rooms/${currentRoom}/users/${currentUser}`);
            userRef.set({ name: currentUser, role: isAdmin ? "آدمن" : "مدرب" });
            userRef.onDisconnect().remove();

            // الاستماع لأعضاء الروم
            db.ref(`rooms/${currentRoom}/users`).on('value', snapshot => {
                const users = snapshot.val();
                const container = document.getElementById('room-users');
                if (users) {
                    container.innerHTML = Object.values(users).map(u => `<span class="user-tag">${u.name} ${u.role === 'آدمن' ? '👑' : ''}</span>`).join('');
                } else {
                    container.innerHTML = 'لا يوجد أحد';
                }
            });

            // الاستماع للمزاد الحقيقي
            db.ref(`rooms/${currentRoom}/auction`).on('value', snapshot => {
                const data = snapshot.val();
                currentAuctionData = data;
                if (data && data.active) {
                    document.getElementById('auction-area').classList.remove('hidden');
                    document.getElementById('player-name').innerText = data.player.name;
                    document.getElementById('player-pos').innerText = data.player.pos;
                    document.getElementById('player-rating').innerText = data.player.rating;
                    document.getElementById('player-img').src = data.player.photo;
                    document.getElementById('highest-bid').innerText = data.highestBid;
                    document.getElementById('highest-bidder').innerText = data.highestBidder || 'لا أحد';

                    startTimer(data.endTime);
                } else {
                    document.getElementById('auction-area').classList.add('hidden');
                    clearInterval(timerInterval);
                }
            });
        }

        function startNextAuction() {
            if (!isAdmin) return;
            const randomPlayer = realAndIconPlayers[Math.floor(Math.random() * realAndIconPlayers.length)];
            const timeSec = parseInt(document.getElementById('custom-timer').value) || 20;
            const endTime = Date.now() + (timeSec * 1000);

            db.ref(`rooms/${currentRoom}/auction`).set({
                player: randomPlayer,
                highestBid: 0,
                highestBidder: "",
                endTime: endTime,
                active: true
            });
        }

        function placeBid(amount) {
            if (!currentAuctionData || !currentAuctionData.active) return;

            const newBid = currentAuctionData.highestBid + amount;
            if (newBid > myBudget) {
                alert("ميزانيتك لا تكفي لهذه المزايدة!");
                return;
            }

            db.ref(`rooms/${currentRoom}/auction`).update({
                highestBid: newBid,
                highestBidder: currentUser
            });
        }

        function startTimer(endTime) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                const left = Math.max(0, Math.ceil((endTime - now) / 1000));
                document.getElementById('timer').innerText = left;

                if (left <= 0) {
                    clearInterval(timerInterval);
                    if (isAdmin && currentAuctionData && currentAuctionData.active) {
                        endAuction();
                    }
                }
            }, 500);
        }

        function endAuction() {
            db.ref(`rooms/${currentRoom}/auction/active`).set(false);
            if (currentAuctionData && currentAuctionData.highestBidder) {
                db.ref(`rooms/${currentRoom}/winners`).push({
                    winner: currentAuctionData.highestBidder,
                    player: currentAuctionData.player,
                    price: currentAuctionData.highestBid
                });
            }
        }

        // الاستماع للفائزين لتحديث التشكيلة
        db.ref(`rooms/${currentRoom}/winners`).on('child_added', snapshot => {
            const winData = snapshot.val();
            if (winData.winner === currentUser) {
                myBudget -= winData.price;
                myTeam.push(winData.player);
                document.getElementById('budget').innerText = myBudget;
                document.getElementById('team-count').innerText = myTeam.length;

                const teamDiv = document.getElementById('my-team');
                teamDiv.innerHTML = myTeam.map(p => `<span class="player-tag">${p.name} (${p.pos})</span>`).join('');
                
                confetti({ particleCount: 50, spread: 60 });
            }
        });

        function finishMyAuction() {
            alert(`تهانينا يا ${currentUser}! أنهيت المزاد بـ ${myTeam.length} لاعبين، والمتبقي من ميزانيتك: ${myBudget}M$`);
        }
    </script>
</body>
</html>
