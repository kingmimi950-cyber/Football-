<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزاد النجوم الاحترافي - Star Auction</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        input, select, button {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input { background: #1f293d; color: #fff; border: 1px solid #374151; }

        button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:active { transform: scale(0.98); }

        .btn-bid {
            background: linear-gradient(135deg, #10b981, #059669);
            width: 48%;
            display: inline-block;
        }

        /* كارت اللاعب الاحترافي */
        .fut-card {
            background: linear-gradient(135deg, #2a1b08 0%, #f59e0b 50%, #78350f 100%);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            position: relative;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
            margin: 15px 0;
            border: 2px solid #fbbf24;
        }

        .fut-card .rating { font-size: 36px; font-weight: 900; line-height: 1; }
        .fut-card .pos { font-size: 18px; font-weight: bold; text-transform: uppercase; }
        .fut-card .name { font-size: 24px; font-weight: bold; margin: 10px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }

        .price-tag {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 18px;
            color: #facc15;
            font-weight: bold;
        }

        .hidden { display: none; }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .mini-player-card {
            background: #1f293d;
            padding: 10px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-blue);
            text-align: right;
            font-size: 14px;
        }

        .ai-result {
            background: #1e1b4b;
            border: 1px solid #6366f1;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: right;
            line-height: 1.6;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <h2>⚽ مزاد النجوم الاحترافي</h2>

        <!-- شاشة تسجيل الدخول -->
        <div id="setup-screen" class="card">
            <h3>انضمام للغرفة</h3>
            <input type="text" id="username" placeholder="اسم المدرب">
            <input type="text" id="room-code" placeholder="كود الغرفة (مثال: 777)">
            <button onclick="joinRoom(false)">دخول كـ مدرب (لاعب)</button>
            <button onclick="joinRoom(true)" style="background: linear-gradient(135deg, #7c3aed, #6d28d9);">دخول كـ منظم المزاد (آدمن)</button>
        </div>

        <!-- شاشة اللعب الرئيسية -->
        <div id="game-screen" class="card hidden">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="room-display" style="color:#9ca3af;">غرفة: --</span>
                <span class="price-tag">💰 <span id="budget">100</span>M$</span>
            </div>

            <!-- لوحة التحكم للآدمن -->
            <div id="admin-panel" class="hidden" style="background:#1f293d; padding:15px; border-radius:12px; margin:15px 0;">
                <h4 style="margin-top:0;">⚙️ لوحة منظم المزاد</h4>
                <select id="player-select">
                    <option value="ليونيل ميسي|RW|93|50">ليونيل ميسي (RW - 93)</option>
                    <option value="كريستيانو رونالدو|ST|91|40">كريستيانو رونالدو (ST - 91)</option>
                    <option value="كيليان مبابي|ST|92|45">كيليان مبابي (ST - 92)</option>
                    <option value="كيفين دي بروين|CM|91|35">كيفين دي بروين (CM - 91)</option>
                    <option value="فيرجيل فان دايك|CB|89|30">فيرجيل فان دايك (CB - 89)</option>
                    <option value="محمد صلاح|RW|90|40">محمد صلاح (RW - 90)</option>
                    <option value="جود بيلينجهام|CM|90|38">جود بيلينجهام (CM - 90)</option>
                    <option value="مانويل نوير|GK|88|25">مانويل نوير (GK - 88)</option>
                </select>
                <button onclick="startAuction()" style="background:#059669;">طرح اللاعب للمزاد</button>
                <button onclick="finishAuction()" style="background:#dc2626;">إعلان الفائز وحسم الصفقة</button>
            </div>

            <!-- كارت اللاعب المعروض للمزاد -->
            <div class="fut-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="rating" id="player-rating">--</div>
                    <div class="pos" id="player-pos">---</div>
                </div>
                <div class="name" id="player-name">بانتظار المزاد...</div>
                <div style="font-size:14px; opacity:0.9;">أعلى مزايدة حالية:</div>
                <div style="font-size:28px; font-weight:bold; color:#fef08a;"><span id="current-bid">0</span> M$</div>
                <div style="margin-top:5px; font-size:14px;">المزايد الحالي: <strong id="highest-bidder" style="color:#67e8f9;">لا يوجد</strong></div>
            </div>

            <!-- أزرار المزايدة -->
            <div>
                <button class="btn-bid" onclick="placeBid(5)">+5 مليون $</button>
                <button class="btn-bid" onclick="placeBid(10)">+10 مليون $</button>
            </div>

            <!-- تشكيلة اللاعب -->
            <div style="margin-top:25px; text-align:right;">
                <h3>📋 تشكيلة فريقي (<span id="team-count">0</span>/11):</h3>
                <div class="team-grid" id="team-grid">
                    <div style="grid-column: span 2; color:#6b7280; text-align:center;">لم تقم بشراء أي لاعب بعد.</div>
                </div>
                
                <button onclick="evaluateTeamAI()" style="margin-top:15px; background:linear-gradient(135deg, #4f46e5, #4338ca);">🤖 تحليل التشكيلة بالذكاء الاصطناعي</button>
                <div id="ai-evaluation" class="ai-result hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCAHuaUJZtif4zS3fDJBM1AMsPNFSrPYPk",
            authDomain: "football-game-2176c.firebaseapp.com",
            databaseURL: "https://football-game-2176c-default-rtdb.firebaseio.com",
            projectId: "football-game-2176c",
            storageBucket: "football-game-2176c.firebasestorage.app",
            messagingSenderId: "520018134224",
            appId: "1:520018134224:web:82ff84ccea9a5697ec8ad5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentRoom = "";
        let playerName = "";
        let myBudget = 100;
        let isAdmin = false;
        let myTeam = [];

        function joinRoom(adminMode) {
            playerName = document.getElementById('username').value.trim();
            currentRoom = document.getElementById('room-code').value.trim();
            isAdmin = adminMode;

            if (!playerName || !currentRoom) {
                alert("يرجى كتابة الاسم وكود الغرفة!");
                return;
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('room-display').innerText = `غرفة: ${currentRoom}`;

            if (isAdmin) {
                document.getElementById('admin-panel').classList.remove('hidden');
            }

            const roomRef = database.ref('rooms/' + currentRoom);
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.auction) {
                        const a = data.auction;
                        document.getElementById('player-name').innerText = a.name;
                        document.getElementById('player-pos').innerText = a.pos;
                        document.getElementById('player-rating').innerText = a.rating;
                        document.getElementById('current-bid').innerText = a.currentBid;
                        document.getElementById('highest-bidder').innerText = a.highestBidder || "لا يوجد";
                    }

                    if (data.lastSold && data.lastSold.winner === playerName && !myTeam.some(p => p.id === data.lastSold.id)) {
                        myTeam.push(data.lastSold);
                        myBudget -= data.lastSold.price;
                        document.getElementById('budget').innerText = myBudget;
                        renderTeamUI();
                    }
                }
            });
        }

        function startAuction() {
            const raw = document.getElementById('player-select').value.split('|');
            database.ref('rooms/' + currentRoom + '/auction').set({
                id: Date.now(),
                name: raw[0],
                pos: raw[1],
                rating: parseInt(raw[2]),
                currentBid: parseInt(raw[3]),
                highestBidder: "لا يوجد"
            });
        }

        function placeBid(inc) {
            const currentBid = parseInt(document.getElementById('current-bid').innerText) || 0;
            const newBid = currentBid + inc;

            if (newBid > myBudget) {
                alert("ميزانيتك غير كافية!");
                return;
            }

            database.ref('rooms/' + currentRoom + '/auction').update({
                currentBid: newBid,
                highestBidder: playerName
            });
        }

        function finishAuction() {
            const bidder = document.getElementById('highest-bidder').innerText;
            const name = document.getElementById('player-name').innerText;
            const price = parseInt(document.getElementById('current-bid').innerText);
            const pos = document.getElementById('player-pos').innerText;
            const rating = parseInt(document.getElementById('player-rating').innerText);

            if (bidder === "لا يوجد") {
                alert("لم يزايد أحد على اللاعب!");
                return;
            }

            database.ref('rooms/' + currentRoom + '/lastSold').set({
                id: Date.now(),
                name: name,
                price: price,
                winner: bidder,
                pos: pos,
                rating: rating
            });

            alert(`🎉 تم حسم المزاد لصالح ${bidder} بمبلغ ${price}M$!`);
        }

        function renderTeamUI() {
            const grid = document.getElementById('team-grid');
            document.getElementById('team-count').innerText = myTeam.length;

            if (myTeam.length === 0) return;

            grid.innerHTML = myTeam.map(p => `
                <div class="mini-player-card">
                    <strong>${p.name}</strong> (${p.pos})
                    <br><span style="color:#facc15;">طاقة: ${p.rating}</span> | <span style="color:#34d399;">${p.price}M$</span>
                </div>
            `).join('');
        }

        function evaluateTeamAI() {
            const aiBox = document.getElementById('ai-evaluation');
            aiBox.classList.remove('hidden');

            if (myTeam.length === 0) {
                aiBox.innerHTML = "🤖 <strong>المدرب الذكي:</strong> تشكيلتك فارغة حالياً. قم بشراء بعض اللاعبين لتلقي التحليل الخططي.";
                return;
            }

            let totalRating = 0;
            let positions = { GK: 0, CB: 0, CM: 0, ST: 0, RW: 0 };

            myTeam.forEach(p => {
                totalRating += p.rating;
                if (positions[p.pos] !== undefined) positions[p.pos]++;
            });

            let avgRating = (totalRating / myTeam.length).toFixed(1);
            let chemistry = Math.min(100, myTeam.length * 10 + (positions.CM > 0 ? 15 : 0));

            let analysis = `🤖 <strong>تقرير المدرب الذكي (AI Coach):</strong><br>`;
            analysis += `• <strong>معدل طاقات الفريق:</strong> ${avgRating} / 100<br>`;
            analysis += `• <strong>تناغم التشكيلة (Chemistry):</strong> ${chemistry}%<br><br>`;

            if (positions.GK === 0) {
                analysis += `⚠️ <strong>ثغرة:</strong> فريقك يفتقر لحارس مرمى! ابحث عن حارس في المزاد القادم.<br>`;
            }
            if (positions.ST + positions.RW > 2) {
                analysis += `🔥 <strong>القوة:</strong> خط هجوم كاسح وقادرة على تسجيل العديد من الأهداف.<br>`;
            }
            if (myBudget < 15) {
                analysis += `💡 <strong>نصيحة مالية:</strong> ميزانيتك المنخفضة تتطلب الحذر في المزايدات القادمة.`;
            }

            aiBox.innerHTML = analysis;
        }
    </script>
</body>
</html>
