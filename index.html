<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزاد النجوم - تطوير محمد خميس</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --gold: #f59e0b;
            --green: #10b981;
            --blue: #3b82f6;
            --red: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: #f3f4f6;
            margin: 0;
            padding: 12px;
            text-align: center;
        }

        .container { max-width: 500px; margin: 0 auto; }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dev-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold);
            color: #fef08a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            background: var(--blue);
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        button:active { transform: scale(0.98); }

        .fut-card {
            background: linear-gradient(135deg, #1e1b4b, #4c1d95);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 15px;
            position: relative;
            margin: 10px 0;
        }

        .player-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            background: #000;
            margin: 8px 0;
        }

        .rating { font-size: 32px; font-weight: 900; color: #fef08a; }
        .pos { background: var(--gold); color: #000; padding: 2px 8px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .name { font-size: 22px; font-weight: bold; margin: 5px 0; }

        .bid-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .btn-bid { background: var(--green); font-size: 14px; padding: 10px 0; }

        .pitch-box {
            background: #14532d;
            border: 2px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            font-size: 12px;
        }

        .pitch-row {
            display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 6px 0;
        }

        .player-tag {
            background: #0f172a; border: 1px solid var(--gold); padding: 4px 8px; border-radius: 6px;
        }

        .hidden { display: none; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <div class="dev-badge">👑 تصميم وتطوير: محمد خميس</div>

        <!-- 1. شاشة الدخول -->
        <div id="setup-screen" class="card">
            <h3>⚽ دخول المزاد</h3>
            <input type="text" id="username" placeholder="اسم المدرب">
            <input type="text" id="room-code" placeholder="كود الغرفة">
            <button onclick="joinGame(false)">دخول كـ مدرب</button>
            <button onclick="joinGame(true)" style="background: #7c3aed;">دخول كـ آدمن</button>
        </div>

        <!-- 2. شاشة اللعبة -->
        <div id="game-screen" class="card hidden">
            <div style="display:flex; justify-content:space-between; font-weight:bold;">
                <span id="room-txt">غرفة: --</span>
                <span style="color:var(--green);">💰 <span id="budget">200</span>M$</span>
            </div>

            <!-- لوحة التحكم للآدمن -->
            <div id="admin-panel" class="card hidden" style="background:#1f2937; margin-top:10px;">
                <h4 style="margin:0 0 8px 0; color:#60a5fa;">⚙️ لوحة الآدمن</h4>
                <select id="player-select">
                    <option value="محمد صلاح|RW|90|https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=200">محمد صلاح (90)</option>
                    <option value="فينيسيوس جونيور|LW|91|https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=200">فينيسيوس جونيور (91)</option>
                    <option value="كيليان مبابي|ST|92|https://images.unsplash.com/photo-1518091043644-c1d4457512c6?w=200">كيليان مبابي (92)</option>
                    <option value="كيفين دي بروين|CAM|91|https://images.unsplash.com/photo-1511886929837-354d827aae26?w=200">كيفين دي بروين (91)</option>
                    <option value="فيرجيل فان دايك|CB|89|https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?w=200">فيرجيل فان دايك (89)</option>
                </select>
                <button onclick="startAuction()" style="background:var(--green);">🚀 طرح للمزاد</button>
                <button onclick="finishAuction()" style="background:var(--red);">🔨 حسم الصفقة للأعلى</button>
                <button onclick="finishForOpponent()" style="background:var(--gold); color:#000;">⚡ حسم الصفقة لـ خصم معين</button>
                <button onclick="giveRandomCompensation()" style="background:#8b5cf6;">🎁 لاعب عشوائي للخاسر (تعويض)</button>
            </div>

            <!-- بطاقة اللاعب للمزاد -->
            <div class="fut-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="rating" id="p-rating">--</div>
                    <span class="pos" id="p-pos">---</span>
                </div>
                <img id="p-img" class="player-img" src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=200" alt="اللاعب">
                <div class="name" id="p-name">بانتظار المزاد...</div>
                
                <div style="background:rgba(0,0,0,0.4); padding:8px; border-radius:10px; margin-top:8px;">
                    <div>أعلى سومة: <strong id="c-bid" style="color:var(--gold); font-size:20px;">0</strong> M$</div>
                    <div>المزايد: <strong id="c-bidder" style="color:#38bdf8;">لا يوجد</strong></div>
                </div>
            </div>

            <!-- أزرار المزايدة -->
            <div class="bid-grid">
                <button class="btn-bid" onclick="bid(5)">+5M</button>
                <button class="btn-bid" onclick="bid(10)">+10M</button>
                <button class="btn-bid" onclick="bid(15)">+15M</button>
                <button class="btn-bid" onclick="bid(20)">+20M</button>
            </div>

            <!-- ملعب فريقك -->
            <div class="pitch-box">
                <h4 style="margin:0 0 5px 0;">📋 تشكيلتك الحالية:</h4>
                <div id="team-list" class="pitch-row">
                    <span style="color:#9ca3af;">لم تشترِ أي لاعب بعد</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCAHuaUJZtif4zS3fDJBM1AMsPNFSrPYPk",
            authDomain: "football-game-2176c.firebaseapp.com",
            databaseURL: "https://football-game-2176c-default-rtdb.firebaseio.com",
            projectId: "football-game-2176c",
            storageBucket: "football-game-2176c.firebasestorage.app",
            messagingSenderId: "520018134224",
            appId: "1:520018134224:web:82ff84ccea9a5697ec8ad5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let room = "", myName = "", myBudget = 200, isAdmin = false;
        let myTeam = [], currentAuction = null;

        const randomPool = [
            { name: "أنخيل دي ماريا", pos: "RW", rating: 84 },
            { name: "تياغو سيلفا", pos: "CB", rating: 83 },
            { name: "مانويل نيوير", pos: "GK", rating: 87 },
            { name: "رياض محرز", pos: "RW", rating: 85 }
        ];

        function joinGame(admin) {
            myName = document.getElementById('username').value.trim();
            room = document.getElementById('room-code').value.trim();
            isAdmin = admin;

            if(!myName || !room) return alert("أدخل اسمك وكود الغرفة!");

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('room-txt').innerText = `غرفة: ${room}`;

            if(isAdmin) document.getElementById('admin-panel').classList.remove('hidden');

            // الاستماع للتغيرات
            db.ref(`rooms/${room}`).on('value', (snap) => {
                const data = snap.val();
                if(!data) return;

                if(data.auction) {
                    currentAuction = data.auction;
                    document.getElementById('p-name').innerText = currentAuction.name;
                    document.getElementById('p-pos').innerText = currentAuction.pos;
                    document.getElementById('p-rating').innerText = currentAuction.rating;
                    document.getElementById('p-img').src = currentAuction.img;
                    document.getElementById('c-bid').innerText = currentAuction.bid;
                    document.getElementById('c-bidder').innerText = currentAuction.bidder;
                }

                if(data.lastSold) {
                    const sold = data.lastSold;
                    if(sold.winner === myName && !myTeam.some(p => p.id === sold.id)) {
                        myTeam.push(sold);
                        myBudget -= sold.price;
                        document.getElementById('budget').innerText = myBudget;
                        confetti({ particleCount: 80, spread: 60 });
                        renderTeam();
                    }
                }
            });
        }

        function startAuction() {
            const val = document.getElementById('player-select').value.split('|');
            db.ref(`rooms/${room}/auction`).set({
                id: Date.now(),
                name: val[0], pos: val[1], rating: parseInt(val[2]), img: val[3],
                bid: 0, bidder: "لا يوجد"
            });
        }

        function bid(inc) {
            if(!currentAuction) return;
            const newBid = currentAuction.bid + inc;
            if(newBid > myBudget) return alert("ميزانيتك لا تكفي!");

            db.ref(`rooms/${room}/auction`).update({
                bid: newBid,
                bidder: myName
            });
        }

        function finishAuction() {
            if(!currentAuction || currentAuction.bidder === "لا يوجد") return alert("لا يوجد مزايد!");
            
            db.ref(`rooms/${room}/lastSold`).set({
                id: currentAuction.id,
                name: currentAuction.name,
                pos: currentAuction.pos,
                rating: currentAuction.rating,
                price: currentAuction.bid,
                winner: currentAuction.bidder
            });

            db.ref(`rooms/${room}/auction`).update({ name: "تم البيع!", bidder: "انتهى المزاد", bid: 0 });
        }

        function finishForOpponent() {
            const target = prompt("أدخل اسم المدرب/الخصم المطلوب حسم اللاعب له:");
            if(!target) return;

            db.ref(`rooms/${room}/lastSold`).set({
                id: currentAuction ? currentAuction.id : Date.now(),
                name: currentAuction ? currentAuction.name : "لاعب ممتاز",
                pos: currentAuction ? currentAuction.pos : "ST",
                rating: currentAuction ? currentAuction.rating : 88,
                price: currentAuction ? currentAuction.bid : 10,
                winner: target
            });

            db.ref(`rooms/${room}/auction`).update({ name: `تم الحسم لـ ${target}`, bidder: "تم الصفقة", bid: 0 });
        }

        function giveRandomCompensation() {
            const loser = prompt("أدخل اسم المدرب الخاسر لمنحه لاعباً عشوائياً:");
            if(!loser) return;

            const rnd = randomPool[Math.floor(Math.random() * randomPool.length)];
            db.ref(`rooms/${room}/lastSold`).set({
                id: Date.now(),
                name: rnd.name,
                pos: rnd.pos,
                rating: rnd.rating,
                price: 0,
                winner: loser
            });

            alert(`تم إرسال ${rnd.name} مجاناً لـ ${loser}!`);
        }

        function renderTeam() {
            const container = document.getElementById('team-list');
            container.innerHTML = myTeam.map(p => `
                <div class="player-tag">
                    <strong>${p.name}</strong> (${p.pos} - ${p.rating})
                </div>
            `).join('');
        }
    </script>
</body>
</html>
