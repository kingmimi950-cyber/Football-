<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزاد كرة القدم اللحظي | Football Bidding App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        h1 { font-size: 24px; color: var(--primary); margin-bottom: 8px; }
        p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background-color: var(--bg-color);
            color: var(--text);
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        input:focus { border-color: var(--accent); }

        .code-input {
            letter-spacing: 4px;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: var(--text-muted);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1);
        }
        .divider span { padding: 0 10px; }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-create { background-color: var(--primary); color: #fff; }
        .btn-create:hover { background-color: var(--primary-hover); }
        .btn-join { background-color: var(--accent); color: #fff; }
        .btn-join:hover { background-color: var(--accent-hover); }
        .btn-leave { background-color: var(--danger); color: white; margin-top: 15px; }

        .hidden { display: none !important; }

        .room-code-badge {
            background: rgba(59, 130, 246, 0.2);
            border: 1px dashed var(--accent);
            padding: 10px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            color: var(--accent);
            margin: 15px 0;
            letter-spacing: 3px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 15px;
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold);
        }

        /* تصميم كارت اللاعب والصورة */
        .player-card {
            background: var(--bg-color);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 15px;
            margin: 15px 0;
            position: relative;
        }

        .player-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold);
            margin: 10px auto;
            background-color: var(--card-bg);
            display: block;
        }

        .timer {
            font-size: 28px;
            font-weight: bold;
            color: var(--danger);
            margin-bottom: 5px;
        }

        .bid-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
    </style>

    <!-- مكتبات Firebase 8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        
        <!-- 1. شاشة اللوبي ودخول الغرف -->
        <div id="lobby-screen">
            <h1>⚽ مزاد كرة القدم</h1>
            <p>أنشئ غرفة خاصة أو انضم لغرفة منافسك</p>

            <div class="input-group">
                <label>اسم المدرب:</label>
                <input type="text" id="username" placeholder="أدخل اسمك...">
            </div>

            <button class="btn-create" onclick="createRoom()">➕ إنشاء غرفة جديدة</button>

            <div class="divider"><span>أو</span></div>

            <div class="input-group">
                <label>كود الغرفة:</label>
                <input type="text" id="room-code-input" class="code-input" placeholder="مثال: A7X9" maxlength="4">
            </div>
            
            <button class="btn-join" onclick="joinRoom()">🚪 الانضمام للغرفة</button>
        </div>

        <!-- 2. شاشة الانتظار داخل الغرفة -->
        <div id="room-screen" class="hidden">
            <h2>غرفة الانتظار</h2>
            <div id="status-badge" class="status-badge">⏳ في انتظار المنافس...</div>
            
            <p>شارك هذا الكود مع صديقك:</p>
            <div id="display-room-code" class="room-code-badge">----</div>

            <div style="text-align: right; margin-top: 15px;">
                <p><strong>المدربون والمتواجدون:</strong></p>
                <ul id="players-list" style="list-style: none; padding: 10px 0; font-size: 13px;"></ul>
            </div>

            <button class="btn-leave" onclick="leaveRoom()">مغادرة الغرفة</button>
        </div>

        <!-- 3. شاشة المزاد المباشر -->
        <div id="auction-screen" class="hidden">
            <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px;">
                <span>💰 ميزانيتك: <strong id="my-coins" style="color:var(--primary);">1000M</strong></span>
                <span>👥 المنافس: <strong id="opponent-coins" style="color:var(--danger);">1000M</strong></span>
            </div>

            <div class="player-card">
                <div id="timer-badge" class="timer">⏳ 15</div>
                
                <!-- صورة اللاعب -->
                <img id="player-img" class="player-img" src="" alt="Player Image" onerror="this.src='https://via.placeholder.com/120?text=Player';">
                
                <h3 id="player-name" style="color: var(--text);">جاري التحميل...</h3>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">القوة الإجمالية: <span id="player-ovr">--</span></p>
                
                <div style="font-size: 18px; margin-top: 12px; color: var(--primary);">
                    أعلى عرض: <strong id="current-bid-price">0M</strong>
                </div>
                <p style="font-size: 11px; color: var(--gold); margin-top: 4px;" id="highest-bidder-txt">صاحب العرض: لا يوجد</p>
            </div>

            <div class="bid-buttons">
                <button onclick="placeBid(10)" class="btn-join">+10M</button>
                <button onclick="placeBid(25)" class="btn-join">+25M</button>
                <button onclick="placeBid(50)" class="btn-create">+50M</button>
            </div>
        </div>

    </div>

    <script>
        // 🔑 إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBDYK-evC0qZWKJupgCakP2Em4X5yT_Qyc",
            authDomain: "social-3108b.firebaseapp.com",
            projectId: "social-3108b",
            storageBucket: "social-3108b.firebasestorage.app",
            messagingSenderId: "489846983999",
            appId: "1:489846983999:web:1e485be0aedb8a665e178a",
            databaseURL: "https://social-3108b-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoomCode = null;
        let currentUser = "";
        let isHost = false;
        let timerInterval = null;
        let currentBidPrice = 0;
        let currentHighestBidder = "";

        // قائمة اللاعبين مع روابط الصور المباشرة
        const auctionPlayers = [
            { 
                name: "ليونيل ميسي", 
                ovr: 93, 
                basePrice: 100, 
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Lionel_Messi_20180626.jpg/440px-Lionel_Messi_20180626.jpg" 
            },
            { 
                name: "كريستيانو رونالدو", 
                ovr: 91, 
                basePrice: 90, 
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Cristiano_Ronaldo_2018.jpg/440px-Cristiano_Ronaldo_2018.jpg" 
            },
            { 
                name: "كيليان إمبابي", 
                ovr: 92, 
                basePrice: 110, 
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Kylian_Mbapp%C3%A9_2018.jpg/440px-Kylian_Mbapp%C3%A9_2018.jpg" 
            },
            { 
                name: "فينيسيوس جونيور", 
                ovr: 89, 
                basePrice: 80, 
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Vinicius_Jr_2021.jpg/440px-Vinicius_Jr_2021.jpg" 
            }
        ];

        // 🎲 توليد رمز غرفة عشوائي
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // ➕ إنشاء غرفة
        function createRoom() {
            const name = document.getElementById('username').value.trim();
            if (!name) return alert("يرجى إدخال اسمك أولاً!");

            currentUser = name;
            isHost = true;
            currentRoomCode = generateRoomCode();

            const roomRef = db.ref('bidding_rooms/' + currentRoomCode);

            roomRef.set({
                status: "waiting",
                createdAt: Date.now(),
                players: {
                    p1: { name: currentUser, coins: 1000, isHost: true }
                }
            }).then(() => {
                roomRef.child('players/p1').onDisconnect().remove();
                openRoomUI(currentRoomCode);
                listenToRoomUpdates(currentRoomCode);
            });
        }

        // 🚪 الانضمام لغرفة
        function joinRoom() {
            const name = document.getElementById('username').value.trim();
            const inputCode = document.getElementById('room-code-input').value.trim().toUpperCase();

            if (!name) return alert("يرجى إدخال اسمك أولاً!");
            if (!inputCode) return alert("يرجى إدخال كود الغرفة!");

            currentUser = name;
            isHost = false;
            currentRoomCode = inputCode;

            const roomRef = db.ref('bidding_rooms/' + currentRoomCode);

            roomRef.once('value', snapshot => {
                if (!snapshot.exists()) return alert("رمز الغرفة غير صحيح!");

                const roomData = snapshot.val();
                if (Object.keys(roomData.players || {}).length >= 2) return alert("الغرفة ممتلئة بالكامل!");

                roomRef.child('players/p2').set({
                    name: currentUser,
                    coins: 1000,
                    isHost: false
                }).then(() => {
                    roomRef.update({ status: "ready" });
                    roomRef.child('players/p2').onDisconnect().remove();
                    openRoomUI(currentRoomCode);
                    listenToRoomUpdates(currentRoomCode);
                });
            });
        }

        // 📡 الاستماع لتغيرات الغرفة
        function listenToRoomUpdates(code) {
            db.ref('bidding_rooms/' + code).on('value', snapshot => {
                if (!snapshot.exists()) {
                    alert("تم إغلاق الغرفة!");
                    location.reload();
                    return;
                }

                const room = snapshot.val();
                const players = room.players || {};
                const playersListUI = document.getElementById('players-list');
                const statusBadge = document.getElementById('status-badge');

                playersListUI.innerHTML = "";
                Object.values(players).forEach(p => {
                    const li = document.createElement('li');
                    li.innerHTML = `👤 <strong>${p.name}</strong> ${p.isHost ? '(المضيف)' : ''}`;
                    playersListUI.appendChild(li);
                });

                if (Object.keys(players).length === 2 && room.status === "ready") {
                    statusBadge.innerText = "✅ اكتمل العدد! جاري بدء المزاد...";
                    db.ref('bidding_rooms/' + code).update({ status: "in_auction" });
                    setTimeout(() => startAuction(code), 1500);
                } else if (room.status === "in_auction") {
                    startAuction(code);
                }
            });
        }

        // 🚀 بدء المزاد
        function startAuction(code) {
            document.getElementById('room-screen').classList.add('hidden');
            document.getElementById('auction-screen').classList.remove('hidden');

            if (isHost) setupNextPlayer(code, 0);
            listenToAuctionUpdates(code);
        }

        // ⚽ تجهيز اللاعب التالي للمزاد
        function setupNextPlayer(code, playerIndex) {
            if (playerIndex >= auctionPlayers.length) {
                alert("🎉 انتهى المزاد على جميع اللاعبين!");
                return;
            }

            const p = auctionPlayers[playerIndex];
            db.ref(`bidding_rooms/${code}/current_auction`).set({
                playerIndex: playerIndex,
                playerName: p.name,
                ovr: p.ovr,
                image: p.image,
                currentBid: p.basePrice,
                highestBidder: "لا يوجد",
                endTime: Date.now() + 15000
            });
        }

        // 📡 الاستماع لتطورات المزاد
        function listenToAuctionUpdates(code) {
            db.ref(`bidding_rooms/${code}/current_auction`).on('value', snapshot => {
                if (!snapshot.exists()) return;

                const data = snapshot.val();
                currentBidPrice = data.currentBid;
                currentHighestBidder = data.highestBidder;

                document.getElementById('player-name').innerText = data.playerName;
                document.getElementById('player-ovr').innerText = data.ovr;
                document.getElementById('player-img').src = data.image || "https://via.placeholder.com/120?text=Player";
                document.getElementById('current-bid-price').innerText = data.currentBid + "M";
                document.getElementById('highest-bidder-txt').innerText = "أعلى عرض من: " + data.highestBidder;

                runUnifiedTimer(data.endTime, code, data.playerIndex);
            });

            db.ref(`bidding_rooms/${code}/players`).on('value', snapshot => {
                const players = snapshot.val() || {};
                Object.values(players).forEach(p => {
                    if (p.name === currentUser) {
                        document.getElementById('my-coins').innerText = p.coins + "M";
                    } else {
                        document.getElementById('opponent-coins').innerText = p.coins + "M";
                    }
                });
            });
        }

        // ⏱️ العداد التنازلي الموحد
        function runUnifiedTimer(endTime, code, playerIndex) {
            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const now = Date.now();
                const timeLeft = Math.ceil((endTime - now) / 1000);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer-badge').innerText = "⏱️ انتهى الوقت!";
                    
                    if (isHost) {
                        setTimeout(() => setupNextPlayer(code, playerIndex + 1), 2000);
                    }
                } else {
                    document.getElementById('timer-badge').innerText = `⏳ ${timeLeft}`;
                }
            }, 200);
        }

        // 💸 دالة المزايدة
        function placeBid(amount) {
            if (currentHighestBidder === currentUser) {
                return alert("أنت صاحب أعلى عرض حالياً!");
            }

            const newBid = currentBidPrice + amount;

            db.ref(`bidding_rooms/${currentRoomCode}/current_auction`).update({
                currentBid: newBid,
                highestBidder: currentUser,
                endTime: Date.now() + 10000
            });
        }

        function openRoomUI(code) {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = code;
        }

        function leaveRoom() {
            if (currentRoomCode) {
                db.ref('bidding_rooms/' + currentRoomCode).off();
                if (isHost) {
                    db.ref('bidding_rooms/' + currentRoomCode).remove();
                } else {
                    db.ref(`bidding_rooms/${currentRoomCode}/players/p2`).remove();
                    db.ref(`bidding_rooms/${currentRoomCode}`).update({ status: "waiting" });
                }
            }
            location.reload();
        }
    </script>
</body>
</html>
