<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة كروت كرة القدم</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f4f4; 
            padding: 20px; 
        }
        h1 { text-align: center; color: #2c3e50; }
        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            padding: 20px;
        }
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.05); }
        .card img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            border-radius: 10px; 
        }
        .card h3 { margin: 10px 0; color: #333; }
        .card p { 
            background-color: #eee; 
            display: inline-block; 
            padding: 5px 10px; 
            border-radius: 5px; 
            font-weight: bold; 
            color: #555; 
        }
    </style>
</head>
<body>

    <h1>قائمة اللاعبين</h1>
    <div class="container" id="cards-container"></div>

    <script>
        const realAndIconPlayers = [
            { name: "إمام عاشور", pos: "CM", rating: 78, photo: "Image/Ashour.webp" },
            { name: "جانلويجي بوفون", pos: "GK", rating: 91, photo: "Image/Buffon.webp" },
            { name: "يوهان كرويف", pos: "CF", rating: 95, photo: "Image/Cruyff.webp" },
            { name: "عثمان ديمبيلي", pos: "RW", rating: 86, photo: "Image/Demble.webp" },
            { name: "ديزيري دويه", pos: "CAM", rating: 78, photo: "Image/Doue.webp" },
            { name: "جيانلويجي دوناروما", pos: "GK", rating: 87, photo: "Image/Dounurema.webp" },
            { name: "باولو ديبالا", pos: "CAM", rating: 86, photo: "Image/Dybala.webp" },
            { name: "إرلينج هالاناد", pos: "ST", rating: 91, photo: "Image/Haland.webp" },
            { name: "تيري هنري", pos: "ST", rating: 93, photo: "Image/Henry.webp" },
            { name: "لامين يامال", pos: "RW", rating: 81, photo: "Image/Lamine Yamal.webp" },
            { name: "رياض محرز", pos: "RW", rating: 85, photo: "Image/Mahrez.webp" },
            { name: "باولو مالديني", pos: "CB", rating: 94, photo: "Image/Maldini.webp" },
            { name: "كيليان إمبابي", pos: "ST", rating: 91, photo: "Image/Mappe.webp" },
            { name: "عمر مرموش", pos: "ST", rating: 83, photo: "Image/Marmoush.webp" },
            { name: "دييجو مارادونا", pos: "CAM", rating: 97, photo: "Image/Marodona.webp" },
            { name: "ليونيل ميسي", pos: "RW", rating: 92, photo: "Image/Messi.webp" },
            { name: "لوكا مودريتش", pos: "CM", rating: 87, photo: "Image/Modric.webp" },
            { name: "نيمار جونيور", pos: "LW", rating: 89, photo: "Image/Neymar.Jr .webp" },
            { name: "ديكلان رايس", pos: "CDM", rating: 87, photo: "Image/Rice.webp" },
            { name: "كريستيانو رونالدو", pos: "ST", rating: 91, photo: "Image/Ronaldo.jpeg" },
            { name: "محمد صلاح", pos: "RW", rating: 89, photo: "Image/Salah.webp" },
            { name: "سيرجيو راموس", pos: "CB", rating: 91, photo: "Image/SergioRamos.jpg" },
            { name: "فان دايك", pos: "CB", rating: 89, photo: "Image/Vandijk.webp" },
            { name: "فينيسيوس جونيور", pos: "LW", rating: 89, photo: "Image/vini.webp" },
            { name: "زين الدين زيدان", pos: "CAM", rating: 96, photo: "Image/zidane.webp" }
        ];

        const container = document.getElementById('cards-container');

        realAndIconPlayers.forEach(player => {
            container.innerHTML += `
                <div class="card">
                    <img src="${player.photo}" alt="${player.name}">
                    <h3>${player.name}</h3>
                    <p>${player.pos} | ${player.rating}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
